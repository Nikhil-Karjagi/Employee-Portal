<div class="form-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h2>{{ isEditMode ? 'Edit Employee' : 'Create New Employee' }}</h2>
      <a routerLink="/employees" class="btn-back">← Back to List</a>
    </div>

    <form (ngSubmit)="onSubmit()" #empForm="ngForm">
      <!-- Error Message Banner -->
      <div *ngIf="errorMessage && errorMessage.trim().length > 0" class="error-banner">
        <strong>Error:</strong> {{ errorMessage }}
      </div>

      <div class="form-grid">
        <!-- Row 1 -->
        <div class="form-group">
          <label>Employee Code *</label>
          <input
            type="text"
            [(ngModel)]="employee.employeeCode"
            name="employeeCode"
            required
            placeholder="EMP001"
          />
        </div>

        <div class="form-group">
          <label>First Name *</label>
          <input
            type="text"
            [(ngModel)]="employee.firstName"
            name="firstName"
            required
            placeholder="First Name"
          />
        </div>

        <!-- Row 2 -->
        <div class="form-group">
          <label>Last Name *</label>
          <input
            type="text"
            [(ngModel)]="employee.lastName"
            name="lastName"
            required
            placeholder="Last Name"
          />
        </div>

        <div class="form-group">
          <label>Email Address *</label>
          <input
            type="email"
            [(ngModel)]="employee.email"
            name="email"
            required
            placeholder="email@example.com"
          />
        </div>

        <!-- Row 3 -->
        <div class="form-group">
          <label>Designation *</label>
          <input
            type="text"
            [(ngModel)]="employee.designation"
            name="designation"
            required
            placeholder="Designation"
          />
        </div>

        <div class="form-group">
          <label>Salary (₹) *</label>
          <input
            type="number"
            [(ngModel)]="employee.salary"
            name="salary"
            required
            placeholder="Salary"
          />
        </div>

        <!-- Row 4 -->
        <div class="form-group">
          <label>Date of Joining *</label>
          <input type="date" [(ngModel)]="employee.dateOfJoining" name="dateOfJoining" required />
        </div>

        <div class="form-group">
          <label>Department *</label>
          <select [(ngModel)]="employee.department.id" name="departmentId" required>
            <option [value]="null" disabled>Select Department</option>
            <option [value]="1">Engineering</option>
            <option [value]="2">Human Resources</option>
            <option [value]="3">Finance</option>
            <option [value]="4">Marketing</option>
          </select>
        </div>

        <!-- Row 5 -->
        <div class="form-group full-width">
          <label>Employment Status *</label>
          <select [(ngModel)]="employee.status" name="status" required>
            <option value="ACTIVE">ACTIVE</option>
            <option value="ON_LEAVE">ON_LEAVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <a routerLink="/employees" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-save" [disabled]="!empForm.valid">Save Employee</button>
      </div>
    </form>
  </div>
</div>
